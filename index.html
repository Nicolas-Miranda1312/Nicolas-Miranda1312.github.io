<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portafolio — Tu Nombre</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  /* antes: body { overflow: hidden; height: 100svh; }  <- eso bloqueaba el scroll */
  body { min-height: 100svh; }
  html { scroll-behavior: smooth; }
  canvas#c { position: fixed; inset: 0; z-index: 0; display: block; height: 100svh; }

  /* --- Sección del juego, debajo de la pantalla de home --- */
  .game-section{
    position: relative;
    z-index: 1;
    margin-top: 100svh;           /* empuja la sección hasta después del home */
    padding: 90px 24px 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    text-align: center;
  }
  .game-section h2{
    font-family: 'Familjen Grotesk', sans-serif;
    font-size: clamp(22px, 4vw, 32px);
    margin: 0;
  }
  .game-section p{
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    opacity: 0.7;
    max-width: 420px;
    margin: 0;
  }
  .browser-window{
    width: 100%;
    max-width: 460px;
    background: #1c1c1c;
    border-radius: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .browser-topbar{
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    background: #2a2a2a;
  }
  .browser-topbar .dot{ width: 11px; height: 11px; border-radius: 50%; }
  .browser-topbar .dot.red{ background:#ff5f57; }
  .browser-topbar .dot.yellow{ background:#febc2e; }
  .browser-topbar .dot.green{ background:#28c840; }
  .browser-topbar .browser-title{
    flex: 1; text-align: center; color: #999; font-size: 12px; margin-right: 40px;
  }
  .browser-body{
    position: relative; width: 100%;
    aspect-ratio: 9 / 16;
    max-height: 78vh;
    background: #000;
  }
  .browser-body iframe{
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: 0;
  }
</style>
</head>
<body>
<!-- hollaaaaaaa -->
<nav class="nav-pill">
<!-- Barra de navegación con enlaces y botón de tema -->
<a href="trabajos.html">Trabajos</a>
<span class="np-sep">·</span>

<div class="knob"></div>
</button>
</nav>

<div id="cursor"><div class="c-ring"></div><div class="c-dot"></div></div>
<canvas id="c"></canvas>

<!-- ▼▼ NUEVO: sección del juego, aparece al hacer scroll debajo del home ▼▼ -->
<section class="game-section" id="proyecto-gustavo">
  <h2>Gustavo el Alien</h2>
  <p>Un mini juego que hice — esquiva los chicles antes de que te aplasten.</p>
  <div class="browser-window">
    <div class="browser-topbar">
      <div class="dot red"></div>
      <div class="dot yellow"></div>
      <div class="dot green"></div>
      <div class="browser-title">gustavo-el-alien.html</div>
    </div>
    <div class="browser-body">
      <iframe src="games/gustavo-el-alien.html" title="Gustavo el Alien - juego" loading="lazy"></iframe>
    </div>
  </div>
</section>
<!-- ▲▲ FIN sección del juego ▲▲ -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>
const SPACING = 20;
let cols, rows, t = 0, mx, my;
function setup() {
createCanvas(windowWidth, windowHeight);
noStroke();
mx = width / 2; my = height / 2;
cols = floor(width / SPACING) + 2;
rows = floor(height / SPACING) + 2;
}
function draw() {
const isDark = document.documentElement.classList.contains('dark');
background(isDark ? 0 : 255, isDark ? 0 : 255, isDark ? 0 : 255);
t += 0.016;
mx = lerp(mx, mouseX, 0.08);
my = lerp(my, mouseY, 0.08);
for (let i = 0; i < cols; i++) {
for (let j = 0; j < rows; j++) {
let x = i * SPACING, y = j * SPACING;
let dx = x - mx, dy = y - my;
let d = sqrt(dx*dx + dy*dy);
let wave = sin(x*.022 + t*1.1)*18 + cos(y*.022 - t*.85)*18 + sin((x-y)*.015 + t*.6)*10;
let inf = constrain(1 - d/180, 0, 1); inf = inf*inf;
let angle = atan2(dy, dx), push = inf*35;
let px = x + cos(angle)*push;
let py = y + wave*.7 + sin(angle)*push;
let wn = map(sin(x*.022 + t*1.1 + j*.3), -1, 1, 0, 1);
let base = map(wn, 0, 1, 160, 30);
let bright = min(base - inf*30, 220);
let sz = map(inf, 0, 1, 1.5, 5.5);
if (inf > 0.05) {
fill(isDark ? 220 : bright, isDark ? 215 : bright, isDark ? 210 : bright, inf*22);
ellipse(px, py, sz*3.5, sz*3.5);
}
fill(isDark ? 220 : bright, isDark ? 215 : bright, isDark ? 210 : bright, map(wn,0,1,80,200));
ellipse(px, py, sz, sz);
if (inf > 0.4) {
fill(isDark ? 240 : 10, isDark ? 235 : 10, isDark ? 227 : 10, 255);
ellipse(px, py, sz*.45, sz*.45);
}
}
}
}
function windowResized() {
resizeCanvas(windowWidth, windowHeight);
cols = floor(width/SPACING)+2;
rows = floor(height/SPACING)+2;
}
</script>
<script src="js/cursor.js"></script>
<script src="js/theme.js"></script>
</body>
</html>
