<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portafolio — Tu Nombre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow-x: hidden; min-height: 100svh; }
    canvas { position: fixed; inset: 0; z-index: 0; display: block; }
    .home-shell {
      position: relative;
      z-index: 2;
      min-height: 180svh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 7rem 1.5rem 4rem;
    }
    .home-title {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 850;
      transition: transform .25s ease, top .25s ease, opacity .25s ease;
      will-change: transform, top;
    }
    .home-title.is-scrolled {
      top: 4.2rem;
      transform: translateX(-50%) scale(0.38);
      opacity: 0;
      pointer-events: none;
    }
    .game-section {
      width: min(100%, 900px);
      margin-top: 82vh;
      padding: 2rem 1.25rem 1.5rem;
      border-radius: 28px;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 24px 60px rgba(0,0,0,.2);
    }
    .scroll-hint {
      position: fixed;
      bottom: 1.3rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 900;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .25rem;
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      opacity: 1;
      transition: opacity .3s ease;
      pointer-events: none;
    }
    .scroll-hint span {
      display: inline-block;
      font-size: 1.35rem;
      animation: bounce 1.2s infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }
    .game-section .sec-label { color: var(--accent); margin-bottom: .6rem; }
    .game-section h2 {
      font-family: var(--font-jersey);
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      margin-bottom: .45rem;
      color: var(--fg);
    }
    .game-section p { color: var(--fg2); margin-bottom: 1rem; max-width: 720px; }
    .game-section iframe {
      width: 100%;
      min-height: 520px;
      border: 0;
      border-radius: 20px;
      background: #050814;
    }
    @media (max-width: 768px) {
      .home-shell { padding-top: 6rem; }
      .game-section { margin-top: 24vh; padding: 1.2rem 1rem 1rem; }
      .game-section iframe { min-height: 450px; }
    }
  </style>
</head>
<body>
<!-- hollaaaaaaa -->
  <nav class="nav-pill">
    <!-- Barra de navegación con enlaces y botón de tema -->
    <a href="trabajos.html">Trabajos</a>
    <span class="np-sep">·</span>
    <a href="index.html" class="active">Home</a>
    <span class="np-sep">·</span>
    <a href="sobre-mi.html">Sobre mí</a>
    <button class="np-toggle" id="theme-btn" aria-label="Modo oscuro / claro">
      <div class="knob"></div>
    </button>
  </nav>

  <div id="cursor"><div class="c-ring"></div><div class="c-dot"></div></div>

  <div class="home-title">NAKU</div>

  <div class="scroll-hint" aria-hidden="true">
    <span>↓</span>
    <div>Scroll</div>
  </div>

  <div class="home-shell">
    <section class="game-section">
      <div class="sec-label">Juego interactivo</div>
      <h2>Gustavo el Alien</h2>
      <p>Desplázate hacia abajo para ver y jugar al juego desde la home.</p>
      <iframe src="Game/gustavo-el-alien.html" title="Gustavo el Alien"></iframe>
    </section>
  </div>

  <canvas id="c"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script>
    const SPACING = 20;
    let cols, rows, t = 0, mx, my;
    const titleEl = document.querySelector('.home-title');

    function updateTitleScroll() {
      const scrolled = window.scrollY || window.pageYOffset;
      const hintEl = document.querySelector('.scroll-hint');
      if (scrolled > 80) {
        titleEl.classList.add('is-scrolled');
        hintEl.style.opacity = '0';
      } else {
        titleEl.classList.remove('is-scrolled');
        hintEl.style.opacity = '1';
      }
    }

    window.addEventListener('scroll', updateTitleScroll, { passive: true });
    window.addEventListener('load', updateTitleScroll);
    function setup() {
      createCanvas(windowWidth, windowHeight);
      noStroke();
      mx = width / 2; my = height / 2;
      cols = floor(width / SPACING) + 2;
      rows = floor(height / SPACING) + 2;
    }
    function draw() {
      const isDark = document.documentElement.classList.contains('dark');
      background(isDark ? 0 : 255, isDark ? 0 : 255, isDark ? 0 : 255);
      t += 0.016;
      mx = lerp(mx, mouseX, 0.08);
      my = lerp(my, mouseY, 0.08);
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          let x = i * SPACING, y = j * SPACING;
          let dx = x - mx, dy = y - my;
          let d  = sqrt(dx*dx + dy*dy);
          let wave = sin(x*.022 + t*1.1)*18 + cos(y*.022 - t*.85)*18 + sin((x-y)*.015 + t*.6)*10;
          let inf = constrain(1 - d/180, 0, 1); inf = inf*inf;
          let angle = atan2(dy, dx), push = inf*35;
          let px = x + cos(angle)*push;
          let py = y + wave*.7 + sin(angle)*push;
          let wn = map(sin(x*.022 + t*1.1 + j*.3), -1, 1, 0, 1);
          let base = map(wn, 0, 1, 160, 30);
          let bright = min(base - inf*30, 220);
          let sz = map(inf, 0, 1, 1.5, 5.5);
          if (inf > 0.05) {
            fill(isDark ? 220 : bright, isDark ? 215 : bright, isDark ? 210 : bright, inf*22);
            ellipse(px, py, sz*3.5, sz*3.5);
          }
          fill(isDark ? 220 : bright, isDark ? 215 : bright, isDark ? 210 : bright, map(wn,0,1,80,200));
          ellipse(px, py, sz, sz);
          if (inf > 0.4) {
            fill(isDark ? 240 : 10, isDark ? 235 : 10, isDark ? 227 : 10, 255);
            ellipse(px, py, sz*.45, sz*.45);
          }
        }
      }
    }
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      cols = floor(width/SPACING)+2;
      rows = floor(height/SPACING)+2;
    }
  </script>
  <script src="js/cursor.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
