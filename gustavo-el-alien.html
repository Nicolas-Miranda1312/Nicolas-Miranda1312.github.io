<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GUSTAVO EL ALIEN — Esquiva los Chicles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0a0a0a;
    --green:#5be05a;
    --green-dark:#2f9b3a;
    --red:#e8362a;
    --blue:#2f4ea3;
    --orange:#e8763a;
    --white:#f4f4f0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:var(--black);
    color:var(--white);
    font-family:'Space Grotesk', sans-serif;
    overflow:hidden;
    touch-action:none;
    position:fixed;
    inset:0;
  }
  #gameWrap{
    position:fixed; inset:0;
    width:100%; height:100%;
  }
  canvas{ display:block; touch-action:none; width:100%; height:100%; }

  #hud{
    position:fixed; top:max(10px, env(safe-area-inset-top)); left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:0 12px;
    pointer-events:none;
    font-family:'Bangers', cursive;
    letter-spacing:1px;
    z-index:5;
  }
  .hud-box{
    background:rgba(0,0,0,0.55);
    border:2px solid var(--white);
    border-radius:8px;
    padding:5px 12px;
    font-size:18px;
    line-height:1.15;
  }
  .hud-box small{
    display:block;
    font-family:'Space Grotesk', sans-serif;
    font-size:9px;
    letter-spacing:1px;
    color:#bbb;
    font-weight:600;
  }
  #speedLabel{ color:var(--orange); }
  #scoreLabel{ color:var(--green); }

  #overlay{
    position:fixed; inset:0;
    background:rgba(5,5,5,0.88);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px;
    gap:10px;
    z-index:10;
  }
  #overlay.hidden{ display:none; }
  #overlay h1{
    font-family:'Bangers', cursive;
    font-size:clamp(30px, 9vw, 52px);
    letter-spacing:2px;
    margin:0;
    color:var(--white);
    text-shadow: 3px 3px 0 var(--green-dark);
    transform: rotate(-1.5deg);
  }
  #overlay .subtitle{
    font-family:'Bangers', cursive;
    font-size:clamp(13px,3vw,16px);
    color:var(--green);
    letter-spacing:3px;
    margin-bottom:6px;
  }
  #overlay h2{
    font-family:'Bangers', cursive;
    font-size:clamp(24px,6vw,36px);
    color:var(--red);
    margin:0;
    text-shadow:2px 2px 0 #000;
  }
  #overlay p{
    margin:2px 0; font-size:14px; color:#ddd; max-width:340px;
  }
  #overlay .bigscore{
    font-family:'Bangers', cursive;
    font-size:34px;
    color:var(--green);
  }
  #overlay .bestscore{ font-size:13px; color:var(--orange); font-weight:700; }
  button{
    font-family:'Bangers', cursive;
    font-size:19px;
    letter-spacing:1px;
    background:var(--green);
    color:#0a0a0a;
    border:3px solid var(--white);
    border-radius:8px;
    padding:11px 30px;
    cursor:pointer;
    margin-top:6px;
    transition:transform 0.08s ease;
  }
  button:disabled{ opacity:0.5; cursor:default; }
  button:active{ transform:scale(0.94); }

  #touchControls{
    position:fixed; left:0; right:0; bottom:max(16px, env(safe-area-inset-bottom));
    display:flex; justify-content:space-between;
    padding:0 16px;
    z-index:5;
    pointer-events:none;
  }
  #touchControls button{
    pointer-events:auto;
    width:64px; height:64px;
    border-radius:50%;
    font-size:24px;
    padding:0;
    background:rgba(10,10,10,0.55);
    color:var(--green);
    border:2px solid var(--green);
  }
  .hint{
    font-size:11px; color:#888; margin-top:4px; text-align:center;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-box" id="scoreLabel">0<small>ESQUIVADOS</small></div>
    <div class="hud-box" id="speedLabel">x1.0<small>VELOCIDAD</small></div>
  </div>

  <div id="overlay">
    <div class="subtitle">ESQUIVA SUS CHICLES</div>
    <h1>GUSTAVO <span style="color:var(--green)">EL ALIEN</span></h1>
    <h2 id="overlayTitle" style="display:none;"></h2>
    <p>Los chicles salen desde el pecho de Gustavo, cruzan la calle y se acercan a ti. Muévete entre los 3 carriles y no dejes que te aplasten.</p>
    <p class="hint">Flechas ◀ ▶ o A / D · Desliza o toca los botones en pantallas táctiles</p>
    <div class="bigscore" id="finalScore" style="display:none;"></div>
    <div class="bestscore" id="bestScoreLine" style="display:none;"></div>
    <button id="startBtn" disabled>CARGANDO...</button>
  </div>

  <div id="touchControls">
    <button id="leftBtn">◀</button>
    <button id="rightBtn">▶</button>
  </div>
</div>

  let assetsLoaded = 0;
  function assetReady(){
    assetsLoaded++;
    if(assetsLoaded >= 2){
      startBtn.disabled = false;
      startBtn.textContent = 'JUGAR';
      computeLayout();
      render();
    }
  }
  sceneImg.onload = assetReady;
  carImg.onload = assetReady;

  // fraction (measured on the artwork) of where Gustavo's white chest square sits —
  // this is both the vanishing point of the street and where the chicles spawn from
  const WHITE_SQUARE_X_FRAC = 0.537;
  const WHITE_SQUARE_Y_FRAC = 0.474;

  const LANES = 3;
  const COLORS = {
    red:   '#e8362a',
    blue:  '#2f4ea3',
    orange:'#e8763a',
    green: '#5be05a'
  };
  const COLOR_KEYS = Object.keys(COLORS);

  let state = 'idle'; // idle | playing | gameover
  let car, gums, score, best, elapsed, spawnTimer, spawnInterval, speedMul;
  let scene = { dx:0, dy:0, dw:0, dh:0 }; // cover-fit placement of the artwork
  let VP = { x:0, y:0 };          // vanishing point = Gustavo's white chest square
  let laneEndX = [0,0,0];         // where each lane sits at the bottom (car level)
  let carY = 0;

  // load best score from persistent storage
  best = 0;
  (function loadBest(){
    try{
      const v = localStorage.getItem('gustavo-best-score');
      if(v){ best = parseInt(v, 10) || 0; }
    }catch(e){ /* no previous score */ }
  })();

  // ---- Fullscreen canvas ----
  function sizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    computeLayout();
  }
  window.addEventListener('resize', sizeCanvas);

  function computeLayout(){
    const cw = canvas.width, ch = canvas.height;
    const iw = sceneImg.naturalWidth || 1226, ih = sceneImg.naturalHeight || 864;

    // cover-fit: the artwork always fills the entire screen, same math used to draw it
    const scale = Math.max(cw/iw, ch/ih);
    scene.dw = iw*scale; scene.dh = ih*scale;
    scene.dx = (cw-scene.dw)/2; scene.dy = (ch-scene.dh)/2;

    // vanishing point = Gustavo's white chest square, mapped through that same transform
    VP.x = scene.dx + WHITE_SQUARE_X_FRAC * scene.dw;
    VP.y = scene.dy + WHITE_SQUARE_Y_FRAC * scene.dh;

    carY = ch - Math.max(70, ch*0.09);

    // the street in the artwork is nearly full-width by the bottom of the frame,
    // so the 3 lanes fan out wide from the vanishing point to match it
    const spread = cw * 0.44;
    laneEndX = [
      Math.max(cw*0.04, VP.x - spread),
      VP.x,
      Math.min(cw*0.96, VP.x + spread)
    ];

    if(car){
      car.w = Math.min(cw/LANES*0.62, 110);
      car.h = car.w * 1.5;
      car.x = laneEndX[car.lane];
    }
  }

  function resetGame(){
    computeLayout();
    car = { lane: 1, x: laneEndX[1], targetLane: 1, w: 0, h: 0 };
    car.w = Math.min(canvas.width/LANES*0.62, 110);
    car.h = car.w * 1.5;
    car.x = laneEndX[1];
    gums = [];
    score = 0;
    elapsed = 0;
    spawnTimer = 0;
    spawnInterval = 85; // frames
    speedMul = 1;
  }

  function startGame(){
    resetGame();
    state = 'playing';
    overlay.classList.add('hidden');
    requestAnimationFrame(loop);
  }

  function endGame(){
    state = 'gameover';
    if(score > best){
      best = score;
      try{ localStorage.setItem('gustavo-best-score', String(best)); }catch(e){}
    }
    overlayTitle.style.display = 'block';
    overlayTitle.textContent = '¡TE APLASTÓ UN CHICLE!';
    finalScoreEl.style.display = 'block';
    finalScoreEl.textContent = 'Esquivaste: ' + score;
    bestScoreLine.style.display = 'block';
    bestScoreLine.textContent = 'Mejor puntaje: ' + best;
    startBtn.textContent = 'REINTENTAR';
    overlay.classList.remove('hidden');
  }

  // ---- Input ----
  function moveLeft(){
    if(state !== 'playing') return;
    car.targetLane = Math.max(0, car.targetLane - 1);
  }
  function moveRight(){
    if(state !== 'playing') return;
    car.targetLane = Math.min(LANES - 1, car.targetLane + 1);
  }
  window.addEventListener('keydown', (e)=>{
    if(['ArrowLeft','a','A'].includes(e.key)) moveLeft();
    if(['ArrowRight','d','D'].includes(e.key)) moveRight();
    if(e.key === ' ' && state !== 'playing' && !startBtn.disabled) startGame();
  });
  leftBtn.addEventListener('click', moveLeft);
  rightBtn.addEventListener('click', moveRight);

  let touchStartX = null;
  canvas.addEventListener('touchstart', (e)=>{ touchStartX = e.touches[0].clientX; }, {passive:true});
  canvas.addEventListener('touchend', (e)=>{
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(dx > 30) moveRight();
    else if(dx < -30) moveLeft();
    touchStartX = null;
  }, {passive:true});

  startBtn.addEventListener('click', ()=>{ if(!startBtn.disabled) startGame(); });

  // ---- Drawing helpers ----
  function drawBackground(){
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0,0,canvas.width, canvas.height);
    if(!sceneImg.complete || sceneImg.naturalWidth === 0) return;

    // the artwork (street + Gustavo already together) covers the ENTIRE screen
    ctx.drawImage(sceneImg, scene.dx, scene.dy, scene.dw, scene.dh);

    // slight darken for contrast so the chicles and car read clearly
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  // perspective curve: eases progress so chicles look far/slow near Gustavo
  // and big/fast as they reach the player, following the street's vanishing point
  function ease(t){ return t*t; }

  function laneCurveX(lane, t){
    return VP.x + (laneEndX[lane]-VP.x) * ease(t);
  }
  function laneCurveY(t){
    return VP.y + (carY - VP.y) * ease(t);
  }

  function drawStreetLanes(dashPhase){
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 3;
    ctx.setLineDash([16,14]);
    ctx.lineDashOffset = -dashPhase;
    // dividers between the 3 lanes, converging to the vanishing point
    for(let i=0;i<2;i++){
      const bottomX = (laneEndX[i] + laneEndX[i+1]) / 2;
      ctx.beginPath();
      ctx.moveTo(VP.x, VP.y);
      ctx.lineTo(bottomX, carY + (canvas.height-carY));
      ctx.stroke();
    }
    // outer road edges
    ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 2;
    const edgePad = (laneEndX[2]-laneEndX[0]) * 0.18;
    [laneEndX[0]-edgePad, laneEndX[2]+edgePad].forEach(bx=>{
      ctx.beginPath();
      ctx.moveTo(VP.x, VP.y);
      ctx.lineTo(bx, canvas.height);
      ctx.stroke();
    });
  }

  const CAR_ASPECT = 371/325; // width/height of the car artwork

  function drawCar(){
    const y = carY;
    const dw = car.w * 1.55;          // the artwork has transparent margin, draw a bit larger than the hit-box
    const dh = dw / CAR_ASPECT;
    ctx.save();
    ctx.translate(car.x, y);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(0, dh*0.42, dw*0.36, 8, 0, 0, Math.PI*2);
    ctx.fill();

    if(carImg.complete && carImg.naturalWidth > 0){
      ctx.drawImage(carImg, -dw/2, -dh/2, dw, dh);
    } else {
      // fallback while the image loads
      ctx.fillStyle = '#f4f4f0';
      ctx.strokeStyle = '#0a0a0a';
      ctx.lineWidth = 3;
      roundRect(-car.w/2, -car.h/2, car.w, car.h, 10);
      ctx.fill();
      ctx.stroke();
    }

    ctx.restore();
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function drawGum(g){
    ctx.save();
    ctx.translate(g.x, g.y);
    ctx.fillStyle = COLORS[g.color];
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = Math.max(1.5, g.r*0.14);
    ctx.beginPath();
    ctx.arc(0,0,g.r,0,Math.PI*2);
    ctx.fill();
    ctx.stroke();
    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(-g.r*0.32, -g.r*0.32, g.r*0.28, g.r*0.16, -0.6, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // ---- Update ----
  let dashPhase = 0;
  function update(){
    elapsed++;

    // difficulty ramps up over time: faster progress + more frequent spawns
    speedMul = 1 + elapsed/1500;
    spawnInterval = Math.max(30, 95 - elapsed/32);
    dashPhase += 3.5 * speedMul;

    // car lane lerp (smooth slide between the 3 lane endpoints)
    const tx = laneEndX[car.targetLane];
    car.x += (tx - car.x) * 0.22;
    car.lane = car.targetLane;

    // spawn — chicles emerge from Gustavo's red ball
    spawnTimer++;
    if(spawnTimer >= spawnInterval){
      spawnTimer = 0;
      const lane = Math.floor(Math.random()*LANES);
      const color = COLOR_KEYS[Math.floor(Math.random()*COLOR_KEYS.length)];
      gums.push({ lane, color, t: 0, dt: 0.0046 });
    }

    const minR = Math.max(4, canvas.width*0.008);
    const maxR = canvas.width/LANES * 0.24;

    for(let i=gums.length-1;i>=0;i--){
      const g = gums[i];
      g.t += g.dt * speedMul;

      const tv = ease(Math.min(g.t,1));
      g.x = VP.x + (laneEndX[g.lane]-VP.x) * tv;
      g.y = VP.y + (carY - VP.y) * tv;
      g.r = minR + (maxR-minR) * tv;

      // collision check once the chicle is near the player's row
      if(g.t > 0.86 && g.t < 1.12){
        const dx = Math.abs(g.x - car.x);
        if(dx < car.w/2 * 0.68 + g.r*0.55){
          endGame();
          return;
        }
      }

      if(g.t >= 1){
        gums.splice(i,1);
        score++;
      }
    }

    scoreLabel.innerHTML = score + '<small>ESQUIVADOS</small>';
    speedLabel.innerHTML = 'x' + speedMul.toFixed(1) + '<small>VELOCIDAD</small>';
  }

  function render(){
    drawBackground();
    gums.forEach(drawGum);
    drawCar();
  }

  function loop(){
    if(state !== 'playing') return;
    update();
    render();
    if(state === 'playing'){
      requestAnimationFrame(loop);
    }
  }

  // idle screen render
  sizeCanvas();
  resetGame();
  render();
})();
</script>
</body>
</html>
