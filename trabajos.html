<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trabajos — Portafolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow: hidden; height: 100svh; }

    /* ── ESCENA ── */
    #scene {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center;
      background: var(--bg);
      transition: background .4s;
    }


    /* ── ARCO ── */
    #arc-wrap {
      position: absolute;
      left: 50%;
      bottom: -20px;
      width: 0; height: 0;
    }

    /* ── TARJETA ── */
    .arc-card {
      position: absolute;
      width: 300px; height: 480px;
      margin-left: -180px;
      border-radius: 18px; overflow: hidden;
      cursor: none;
      box-shadow: 0 6px 28px rgba(0,0,0,.16);
      transition: box-shadow .3s, outline .2s;
      transform-origin: 50% 100%;
      will-change: transform;
    }
    .arc-card.is-center {
      box-shadow: 0 16px 56px rgba(0,0,0,.32);
      outline: 2px solid rgba(255,255,255,.65);
      z-index: 100 !important;
    }

    /* Imagen de portada de la tarjeta */
    .arc-card-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    /* Placeholder cuando no hay imagen */
    .arc-card-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem;
    }

    .arc-card-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: .65rem 1rem;
      background: linear-gradient(transparent, rgba(0,0,0,.62));
      color: #fff; pointer-events: none;
    }
    .acl-num {
      font-family: var(--font-mono); font-size: .5rem;
      letter-spacing: .18em; opacity: .65; line-height: 1; margin-bottom: .2rem;
    }
    .acl-name {
      font-family: var(--font-display); font-size: .85rem;
      font-weight: 500; line-height: 1.2;
    }

    /* ── DETALLE ── */
    #detail {
      position: fixed; inset: 0; z-index: 600;
      background: var(--bg); overflow-y: auto;
      opacity: 0; transform: translateY(32px);
      pointer-events: none;
      transition: opacity .45s cubic-bezier(.25,.46,.45,.94),
                  transform .45s cubic-bezier(.25,.46,.45,.94),
                  background .4s;
    }
    #detail.open { opacity: 1; transform: none; pointer-events: auto; }

    /* ── DETALLE ESCRITORIO ── */
    .det-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 5.5rem 3rem 5rem;
    }

    /* TOP: hero + meta en 2 columnas */
    .det-top {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 3rem;
      align-items: start;
      margin-bottom: 4rem;
    }
    .det-hero {
      width: 100%; aspect-ratio: 16/9;
      border-radius: 16px; overflow: hidden;
      background: var(--card-bg);
      box-shadow: 0 12px 48px rgba(0,0,0,.18);
      display: flex; align-items: center; justify-content: center;
    }
    .det-hero-img { width:100%; height:100%; object-fit:cover; display:block; }
    .det-hero-placeholder {
      width:100%; height:100%;
      display:flex; align-items:center; justify-content:center;
      font-size: 6rem;
    }
    .det-meta { padding-top: .25rem; }
    .det-tags { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .det-title {
      font-family: "Jersey 10", sans-serif;
      font-weight: 400; font-style: normal;
      font-size: clamp(2rem, 3.5vw, 3.2rem); line-height: 1.05; margin-bottom: .4rem;
      color: var(--fg);
    }
    .det-year {
      font-family: var(--font-mono); font-size: .65rem;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--fg3); margin-bottom: 1.4rem;
    }
    .det-desc {
      font-size: 1rem; color: var(--fg2);
      line-height: 1.78; margin-bottom: 2rem;
    }

    /* PROCESO: 4 columnas */
    .det-pgrid {
      display: grid; grid-template-columns: repeat(4,1fr);
      gap: 1px; background: var(--border);
      border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      margin-bottom: 4rem;
    }
    .det-pc {
      background: var(--bg); padding: 1.4rem 1.2rem;
      transition: background .2s;
    }
    .det-pc:hover { background: var(--card-bg); }
    .det-pc h4 {
      font-size: .78rem; font-weight: 700;
      letter-spacing: .07em; text-transform: uppercase;
      color: var(--accent); margin-bottom: .5rem;
    }
    .det-pc p { font-size: .9rem; color: var(--fg2); line-height: 1.6; }

    /* GALERÍA MARQUEE */
    .det-gallery-wrap {
      position: relative; overflow: hidden; margin-bottom: 4rem;
    }
    .det-gallery-wrap::before,
    .det-gallery-wrap::after {
      content: ''; position: absolute; top: 0; bottom: 0; z-index: 2;
      width: 80px; pointer-events: none;
    }
    .det-gallery-wrap::before {
      left: 0;
      background: linear-gradient(to right, var(--bg), transparent);
    }
    .det-gallery-wrap::after {
      right: 0;
      background: linear-gradient(to left, var(--bg), transparent);
    }
    .det-gallery-track {
      display: flex; gap: 1rem;
      width: max-content;
    }
    .det-gallery-track.running {
      animation: det-scroll var(--det-dur, 30s) linear infinite;
    }
    .det-gallery-track:hover { animation-play-state: paused; }
    @keyframes det-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(var(--det-dist, -50%)); }
    }
    .det-gallery-item {
      flex-shrink: 0;
      width: calc((100vw - 6rem) / 6);
      aspect-ratio: 3/4;
      border-radius: 12px; overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.8rem;
      box-shadow: 0 4px 18px rgba(0,0,0,.1);
      transition: transform .3s, box-shadow .3s;
    }
    .det-gallery-item:hover {
      transform: scale(1.04) translateY(-4px);
      box-shadow: 0 12px 36px rgba(0,0,0,.18);
    }
    .det-gallery-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .det-gallery-placeholder {
      width:100%; height:100%;
      display:flex; align-items:center; justify-content:center;
      font-size: 2.8rem;
    }

    /* HERRAMIENTAS + CTA */
    .det-tools { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 3rem; }
    .det-tool {
      font-family: var(--font-mono); font-size: .68rem; letter-spacing: .05em;
      padding: .38rem .95rem;
      background: var(--fg); color: var(--bg);
      border-radius: 100px; transition: background .35s, color .35s;
    }
    .det-cta {
      border-top: 1px solid var(--border); padding-top: 2.5rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .det-cta p { font-size: 1rem; color: var(--fg2); }

    @media (max-width: 900px) {
      .det-top { grid-template-columns: 1fr; gap: 2rem; }
      .det-pgrid { grid-template-columns: 1fr 1fr; }
      .det-gallery-item { width: calc((100vw - 3rem) / 3); }
    }

    /* Botón cerrar detalle */
    #det-close {
      position: fixed; top: 1.2rem; right: 2.5rem; z-index: 700;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1.5px solid var(--border);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      cursor: none; opacity: 0; pointer-events: none;
      transition: opacity .3s, background .2s;
    }
    #det-close.show { opacity: 1; pointer-events: auto; }
    #det-close:hover { background: var(--fg); }
    #det-close svg { transition: stroke .2s; }
    #det-close:hover svg { stroke: var(--bg); }

    @media (max-width: 600px) {
      #arc-wrap { bottom: 30vh; }
      .arc-card { width: 160px; height: 256px; margin-left: -80px; border-radius: 16px; }
      .det-pgrid, .det-gallery { grid-template-columns: 1fr; }
      .det-inner { padding: 4.5rem 1.2rem 3rem; }
    }

    .filter-float {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 850;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: .5rem;
    }
    .filter-btn {
      font-family: var(--font-mono);
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .15em;
      padding: .75rem 1rem;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: #1C1917;
      color: #fff;
      cursor: pointer;
      transition: background .25s, border-color .25s, color .25s;
    }
    .filter-btn:hover,
    .filter-btn[aria-expanded="true"] {
      background: rgba(255,255,255,.08);
    }
    .filter-menu {
      width: min(220px, calc(100vw - 2rem));
      background: #1C1917;
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 18px 60px rgba(0,0,0,.12);
      border-radius: 18px;
      padding: .75rem;
      display: grid;
      gap: .4rem;
    }
    .filter-menu.hidden {
      display: none !important;
    }
    .filter-option {
      font-family: var(--font-mono);
      font-size: .8rem;
      text-align: left;
      letter-spacing: .12em;
      padding: .65rem .85rem;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: background .25s, border-color .25s;
    }
    .filter-option:hover,
    .filter-option.active {
      background: rgba(255,255,255,.08);
      border-color: var(--accent);
    }

    .slider-wrap {
      position: absolute;
      inset: 0;
      z-index: 650;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem 3rem;
      pointer-events: none;
    }
    .slider-wrap.hidden {
      display: none !important;
    }
    .slider-track {
      display: flex;
      gap: 1rem;
      width: max-content;
      padding-bottom: 1rem;
      pointer-events: auto;
      animation: none;
    }
    .slider-track.running {
      animation: slider-scroll var(--slider-dur, 30s) linear infinite;
    }
    @keyframes slider-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(var(--slider-dist, -50%)); }
    }
    .slider-card {
      flex: 0 0 min(320px, 90%);
      width: min(320px, 90%);
      min-height: 460px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.05);
      box-shadow: 0 18px 50px rgba(0,0,0,.18);
      position: relative;
    }
    .slider-card img,
    .slider-card canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .slider-card-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 1rem;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.7));
      color: #fff;
      font-family: var(--font-mono);
      font-size: .78rem;
      line-height: 1.3;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="cursor"><div class="c-ring"></div><div class="c-dot"></div></div>

  <!-- NAV -->
  <nav class="nav-pill">
    <a href="trabajos.html" class="active">Trabajos</a>
    <span class="np-sep">·</span>
    <a href="index.html">Home</a>
    <span class="np-sep">·</span>
    <a href="sobre-mi.html">Sobre mí</a>
    <button class="np-toggle" id="theme-btn" aria-label="Modo oscuro / claro">
      <div class="knob"></div>
    </button>
  </nav>

  <div class="filter-float">
    <button id="filter-btn" class="filter-btn" aria-expanded="false">Filtros</button>
    <div id="filter-menu" class="filter-menu hidden">
      <button type="button" class="filter-option">Interacción Digital</button>
      <button type="button" class="filter-option">Fabricación Digital</button>
      <button type="button" class="filter-option">Prototipado</button>
    </div>
  </div>

  <!-- ESCENA -->
  <div id="scene">
    <div id="arc-wrap"></div>
    <div id="slider-wrap" class="slider-wrap hidden"></div>
  </div>

  <!-- BOTÓN CERRAR DETALLE -->
  <button id="det-close" aria-label="Cerrar">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="1" y1="1" x2="11" y2="11"/>
      <line x1="11" y1="1" x2="1" y2="11"/>
    </svg>
  </button>

  <!-- DETALLE -->
  <div id="detail"><div class="det-inner" id="det-content"></div></div>

  <!-- DARK TOGGLE FIJO -->

  <script src="js/arc.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/theme.js"></script>
  <script>
    const filterBtn = document.getElementById('filter-btn');
    const filterMenu = document.getElementById('filter-menu');
    const sliderWrap = document.getElementById('slider-wrap');
    const arcWrap = document.getElementById('arc-wrap');

    function renderSlider(projects) {
      sliderWrap.innerHTML = '';
      const track = document.createElement('div');
      track.className = 'slider-track';
      const cards = [];

      projects.forEach(proj => {
        const card = document.createElement('article');
        card.className = 'slider-card';

        if (proj.cover) {
          const img = document.createElement('img');
          img.src = proj.cover;
          img.alt = proj.name;
          img.onerror = () => {
            img.replaceWith(makeGenCanvas(proj, 320, 512));
          };
          card.appendChild(img);
        } else {
          card.appendChild(makeGenCanvas(proj, 320, 512));
        }

        const label = document.createElement('div');
        label.className = 'slider-card-label';
        label.innerHTML = `<div class="acl-name">${proj.name}</div><div class="acl-num">Proyecto ${proj.num}</div>`;
        card.appendChild(label);

        track.appendChild(card);
        cards.push(card);
      });

      cards.forEach(card => {
        const clone = card.cloneNode(true);
        clone.setAttribute('aria-hidden', 'true');
        track.appendChild(clone);
      });

      sliderWrap.appendChild(track);
      sliderWrap.classList.remove('hidden');
      arcWrap.hidden = true;

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const halfW = track.scrollWidth / 2;
          track.style.setProperty('--slider-dist', `-${halfW}px`);
          track.style.setProperty('--slider-dur', `${Math.max(15, halfW / 80)}s`);
          track.classList.add('running');
        });
      });
    }

    function resetView() {
      sliderWrap.classList.add('hidden');
      arcWrap.hidden = false;
      sliderWrap.innerHTML = '';
    }

    if (filterBtn && filterMenu) {
      filterBtn.addEventListener('click', () => {
        const open = !filterMenu.classList.contains('hidden');
        if (open) {
          filterMenu.classList.add('hidden');
        } else {
          filterMenu.classList.remove('hidden');
        }
        filterBtn.setAttribute('aria-expanded', String(!open));
      });
      document.addEventListener('click', event => {
        if (!filterMenu.classList.contains('hidden') && !filterMenu.contains(event.target) && event.target !== filterBtn) {
          filterMenu.classList.add('hidden');
          filterBtn.setAttribute('aria-expanded', 'false');
        }
      });
      filterMenu.querySelectorAll('.filter-option').forEach(option => {
        option.addEventListener('click', () => {
          const filter = option.textContent.trim();
          const wasActive = option.classList.contains('active');
          filterMenu.querySelectorAll('.filter-option').forEach(btn => btn.classList.remove('active'));
          if (!wasActive) {
            option.classList.add('active');
            const projects = FILTER_MAP[filter] ? PROJECTS.filter(FILTER_MAP[filter]) : PROJECTS;
            renderSlider(projects);
            if (window.setArcFilter) window.setArcFilter(filter);
          } else {
            resetView();
            if (window.setArcFilter) window.setArcFilter(null);
          }
          filterMenu.classList.add('hidden');
          filterBtn.setAttribute('aria-expanded', 'false');
        });
      });
    }
  </script>
</body>
</html>
