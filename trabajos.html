<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trabajos — Portafolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    body { overflow: hidden; height: 100svh; }

    /* ── ESCENA ── */
    #scene {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center;
      background: var(--bg);
      transition: background .4s;
    }


    /* ── ARCO ── */
    #arc-wrap {
      position: absolute;
      left: 50%;
      bottom: -20px;
      width: 0; height: 0;
    }

    /* ── TARJETA ── */
    .arc-card {
      position: absolute;
      width: 300px; height: 428px;
      margin-left: -150px;
      border-radius: 18px; overflow: hidden;
      cursor: none;
      box-shadow: 0 6px 28px rgba(0,0,0,.16);
      transition: box-shadow .3s, outline .2s;
      transform-origin: 50% 100%;
      will-change: transform;
    }
    .arc-card.is-center {
      box-shadow: 0 16px 56px rgba(0,0,0,.32);
      outline: 2px solid rgba(255,255,255,.65);
      z-index: 100 !important;
    }

    /* Imagen de portada de la tarjeta */
    .arc-card-img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }
    /* Placeholder cuando no hay imagen */
    .arc-card-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem;
    }

    .arc-card-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: .65rem 1rem;
      background: linear-gradient(transparent, rgba(0,0,0,.62));
      color: #fff; pointer-events: none;
    }
    .acl-num {
      font-family: var(--font-mono); font-size: .5rem;
      letter-spacing: .18em; opacity: .65; line-height: 1; margin-bottom: .2rem;
    }
    .acl-name {
      font-family: var(--font-display); font-size: .85rem;
      font-weight: 500; line-height: 1.2;
    }

    /* ── DETALLE ── */
    #detail {
      position: fixed; inset: 0; z-index: 600;
      background: var(--bg); overflow-y: auto;
      opacity: 0; transform: translateY(32px);
      pointer-events: none;
      transition: opacity .45s cubic-bezier(.25,.46,.45,.94),
                  transform .45s cubic-bezier(.25,.46,.45,.94),
                  background .4s;
    }
    #detail.open { opacity: 1; transform: none; pointer-events: auto; }

    .det-inner { max-width: 800px; margin: 0 auto; padding: 5.5rem 2rem 5rem; }

    .det-hero {
      width: 100%; aspect-ratio: 16/9;
      border-radius: 14px; overflow: hidden;
      margin-bottom: 2.2rem;
      background: var(--card-bg);
      box-shadow: 0 10px 40px rgba(0,0,0,.14);
    }
    /* Si hay imagen: <img src="..." class="det-hero-img"> */
    .det-hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .det-hero-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 5rem;
    }

    .det-tags { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .det-title {
      font-family: var(--font-body); font-style: italic; font-weight: 300;
      font-size: clamp(2rem, 5vw, 3.8rem); line-height: 1.05; margin-bottom: .5rem;
      color: var(--fg);
    }
    .det-year {
      font-family: var(--font-mono); font-size: .65rem;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--fg3); margin-bottom: 1.5rem;
    }
    .det-desc {
      font-size: 1.05rem; color: var(--fg2);
      line-height: 1.75; max-width: 560px; margin-bottom: 3rem;
    }

    .det-pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; margin-bottom: 3rem; }
    .det-pc {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 1.25rem;
    }
    .det-pc h4 { font-size: .9rem; font-weight: 500; margin-bottom: .35rem; color: var(--fg); }
    .det-pc p  { font-size: .88rem; color: var(--fg2); line-height: 1.6; }

    /* Galería de imágenes del proyecto */
    .det-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; margin-bottom: 3rem; }
    .det-gallery-item {
      aspect-ratio: 4/3; border-radius: 10px; overflow: hidden;
      background: var(--card-bg);
      box-shadow: 0 3px 12px rgba(0,0,0,.1);
    }
    .det-gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .det-gallery-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
    }

    .det-tools { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 3rem; }
    .det-tool {
      font-family: var(--font-mono); font-size: .68rem; letter-spacing: .05em;
      padding: .38rem .95rem;
      background: var(--fg); color: var(--bg);
      border-radius: 100px;
      transition: background .35s, color .35s;
    }

    .det-cta {
      border-top: 1px solid var(--border);
      padding-top: 2.5rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .det-cta p { font-size: .9rem; color: var(--fg2); }

    /* Botón cerrar detalle */
    #det-close {
      position: fixed; top: 1.2rem; right: 2.5rem; z-index: 700;
      width: 40px; height: 40px; border-radius: 50%;
      border: 1.5px solid var(--border);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      cursor: none; opacity: 0; pointer-events: none;
      transition: opacity .3s, background .2s;
    }
    #det-close.show { opacity: 1; pointer-events: auto; }
    #det-close:hover { background: var(--fg); }
    #det-close svg { transition: stroke .2s; }
    #det-close:hover svg { stroke: var(--bg); }

    @media (max-width: 600px) {
      #arc-wrap { bottom: 30vh; }
      .arc-card { width: 160px; height: 256px; margin-left: -80px; border-radius: 16px; }
      .det-pgrid, .det-gallery { grid-template-columns: 1fr; }
      .det-inner { padding: 4.5rem 1.2rem 3rem; }
    }
  </style>
</head>
<body>
  <div id="cursor"><div class="c-ring"></div><div class="c-dot"></div></div>

  <!-- NAV -->
  <nav class="nav-pill">
    <a href="trabajos.html" class="active">Trabajos</a>
    <span class="np-sep">·</span>
    <a href="index.html">Home</a>
    <span class="np-sep">·</span>
    <a href="sobre-mi.html">Sobre mí</a>
    <button class="np-toggle" id="theme-btn" aria-label="Modo oscuro / claro">
      <div class="knob"></div>
    </button>
  </nav>

  <!-- ESCENA -->
  <div id="scene">
    <div id="arc-wrap"></div>
  </div>

  <!-- BOTÓN CERRAR DETALLE -->
  <button id="det-close" aria-label="Cerrar">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
         stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <line x1="1" y1="1" x2="11" y2="11"/>
      <line x1="11" y1="1" x2="1" y2="11"/>
    </svg>
  </button>

  <!-- DETALLE -->
  <div id="detail"><div class="det-inner" id="det-content"></div></div>

  <!-- DARK TOGGLE FIJO -->

  <script src="js/arc.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
